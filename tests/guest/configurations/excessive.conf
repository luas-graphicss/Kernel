[system]
version = 1
name = "kernel"

[interface]
address = "10.0.2.15"
prefix = 24
gateway = "10.0.2.2"
mtu = 1500

[service.console]
restarts = 2
window_seconds = 60

[service.entropy]
restarts = 2
window_seconds = 60

[service.storage]
restarts = 2
window_seconds = 60
heap_bytes = 2097152

[service.network]
needs = ["entropy"]
restarts = 3
window_seconds = 60
heap_bytes = 16777216

[service.shell]
needs = ["console", "storage"]
restarts = 3
window_seconds = 60
heap_bytes = 2097152

[access.shell]
network = ["connect", "listen", "datagram", "echo", "inspect"]
files = "read-write"
control = ["observe", "launch", "signal", "power"]

[access.application]
network = ["connect", "listen", "datagram", "echo", "inspect"]
files = "read-write"
limit = 4
heap_bytes = 2097152
