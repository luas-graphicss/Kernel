[[component]]
name = "opensbi"
version = "1.5.1"

[[component.advisory]]
id = "CVE-2025-63913"
severity = "high"
applicable = false
reason = "The advisory names 1.3 and has no version ranges yet, so 1.5.1 is not ruled out by version. The flaw needs a caller in supervisor mode using the PMU extension: the kernel calls only the debug console, timer and system reset extensions, and a system call from a process is handled by the kernel and never forwarded to the firmware."

