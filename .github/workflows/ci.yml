name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UV_FROZEN: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Restore the pinned toolchain
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.cache/kernel-tool
          key: kernel-tool-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.lock.toml') }}

      - name: Install host dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Check types
        run: uv run mypy --strict host src

      - name: Run host and conformance tests
        run: uv run pytest tests/host tests/conformance

      - name: Compare the frozen interfaces with their recorded digests
        run: uv run kernel-tool verify-interfaces

      - name: Fetch and verify the toolchain
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool toolchain

      - name: Run hosted native tests and static analysis
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool native-check --profile qemu-riscv64

      - name: Replay the fuzzing seeds, corpus and regressions
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool replay-corpus --all

      - name: Fuzz every input family briefly
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool fuzz --all --budget-hours 0.05

      - name: Build the images
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool build --profile qemu-riscv64

      - name: Boot the bootstrap scenarios
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool test --profile qemu-riscv64 --suite bootstrap

      - name: Run the memory isolation programs
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool test --profile qemu-riscv64 --suite memory

      - name: Run the process lifecycle programs
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool test --profile qemu-riscv64 --suite processes

      - name: Run the capability programs
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool test --profile qemu-riscv64 --suite capabilities

      - name: Run the message passing programs
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool test --profile qemu-riscv64 --suite ipc

      - name: Run the scheduling programs
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool test --profile qemu-riscv64 --suite scheduling

      - name: Run the device driver and service programs
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool test --profile qemu-riscv64 --suite devices

      - name: Run the file service programs
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool test --profile qemu-riscv64 --suite vfs

      - name: Run the persistent volume programs
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool test --profile qemu-riscv64 --suite storage

      - name: Run the network stack programs against the peer
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool test --profile qemu-riscv64 --suite network

      - name: Transfer data both ways over a clean and an impaired link
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool test --profile qemu-riscv64 --suite network-interop

      - name: Run programs loaded from the volume as applications
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool test --profile qemu-riscv64 --suite applications

      - name: Run the service supervision programs and refuse invalid configurations
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool test --profile qemu-riscv64 --suite supervision

      - name: Operate the system through the shell across a restart
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool test --profile qemu-riscv64 --suite system-journey

      - name: Install, update and roll back over one volume and refuse unreadable volumes
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool test --profile qemu-riscv64 --suite release-journey

      - name: Boot the release image repeatedly
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool repeat-boot --profile qemu-riscv64 --count 25

      - name: Measure boot, memory, latency and collector pauses against the budgets
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool benchmark --profile qemu-riscv64

      - name: Keep one boot under mixed load briefly
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool soak --profile qemu-riscv64 --hours 0.05

      - name: Stall a device and fail its reset
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool fault-test --profile qemu-riscv64 --suite device-reset

      - name: Crash the volume at every write and flush
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool fault-test --profile qemu-riscv64 --suite storage-crash

      - name: Send malformed traffic, flood a listener and interrupt the link
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool fault-test --profile qemu-riscv64 --suite network-faults

      - name: Verify the volume image corpus
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool verify-filesystem --corpus tests/faults/storage

      - name: Verify the images
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool verify-artifacts --profile qemu-riscv64

      - name: Build twice from nothing and require identical images
        run: sh .github/scripts/classify-exit.sh uv run kernel-tool reproduce-build --profile qemu-riscv64

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reports
          path: |
            build/qemu-riscv64/reports/
            build/qemu-riscv64/qualification/
            build/fuzz/report.json
            build/fuzz/findings/
          if-no-files-found: warn
